<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>Telão · assistir junto</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #p { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<!-- Ponte entre o Telão e o player do YouTube: o app manda comandos (tocar, pausar, pular) e recebe o estado.
     Fica no GitHub Pages porque o YouTube só toca vídeos incorporados em páginas com endereço de verdade. -->
<div id="p"></div>
<script>
  (function () {
    var player = null, ready = false, parentWin = window.parent, lastTitle = '';
    var post = function (o) { try { parentWin.postMessage(Object.assign({ telaoJunto: 1 }, o), '*'); } catch (e) {} };
    var q = new URLSearchParams(location.search);
    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('p', {
        videoId: q.get('v') || '',
        playerVars: { autoplay: 0, controls: 0, disablekb: 1, fs: 0, rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3, origin: location.origin },
        events: {
          onReady: function () { ready = true; post({ type: 'ready' }); },
          onStateChange: function (e) { post({ type: 'state', state: e.data }); },
          onError: function (e) { post({ type: 'error', code: e.data }); },
        },
      });
    };
    setInterval(function () {
      if (!ready) return;
      var d = player.getVideoData ? player.getVideoData() : null;
      var title = d && d.title || '';
      post({ type: 'tick', time: player.getCurrentTime(), duration: player.getDuration(), state: player.getPlayerState(), title: title !== lastTitle ? (lastTitle = title) : undefined });
    }, 500);
    window.addEventListener('message', function (e) {
      var m = e.data; if (!m || !m.telaoCmd || !ready) return;
      if (m.cmd === 'load') player.cueVideoById({ videoId: m.id, startSeconds: m.t || 0 });
      if (m.cmd === 'play') player.playVideo();
      if (m.cmd === 'pause') player.pauseVideo();
      if (m.cmd === 'seek') player.seekTo(m.t, true);
      if (m.cmd === 'volume') { player.setVolume(Math.round(m.v * 100)); if (m.v > 0) player.unMute(); else player.mute(); }
    });
    var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  })();
</script>
</body>
</html>
